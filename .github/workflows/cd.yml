# CD scaffold: Build/push images on release tags; Render hooks optional.
# Requires CI pass and branch protection configured manually in GitHub.
name: CD - Docker release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  images:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lowercase GHCR repository name
        id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.names.outputs.prefix }}-api:${{ github.sha }}
      # Set repo variable NEXT_PUBLIC_API_URL to public HTTPS API before releasing.
      - name: Require public API URL for web image
        env:
          PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          case "$PUBLIC_API_URL" in https://*) ;; *) echo 'Configure repository variable NEXT_PUBLIC_API_URL as public HTTPS URL'; exit 1 ;; esac
      - name: Build + push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ENABLE_DEMO_PAYMENTS=false
          tags: ${{ steps.names.outputs.prefix }}-web:${{ github.sha }}

  # OPTIONAL: Works only if your Render services are already configured to deploy
  # these corresponding image tags. A hook alone does NOT import GHCR images.
  # No automatic production schema migration is configured (fresh local SQL != production migration).
  # For now deployment and rollback are documented as manual in docs/deployment.md.
