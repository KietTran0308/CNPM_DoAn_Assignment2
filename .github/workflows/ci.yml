name: CI - BrewLite Assignment 2

on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brewlite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API / lint - unit - integration - build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: github_ci_only_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brewlite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://postgres:github_ci_only_password@127.0.0.1:5432/brewlite_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:github_ci_only_password@127.0.0.1:5432/brewlite_test?schema=public
      JWT_SECRET: github_ci_test_jwt_secret_never_use_in_production
      ENABLE_DEMO_PAYMENTS: 'true'
      ZALOPAY_AUTO_RECONCILE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Initialize isolated PostgreSQL database
        shell: bash
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d brewlite_test < prisma/dbBrewLite.sql
      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Lint (TypeScript check)
        run: npm run lint
      - name: Unit + integration tests
        run: npm test
      - name: Build NestJS
        run: npm run build

  web:
    name: Web / lint - test - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_ENABLE_DEMO_PAYMENTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (TypeScript check)
        run: npm run lint
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build Next.js
        run: npm run build

  e2e:
    name: API / localhost E2E - isolated database
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: github_ci_only_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brewlite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://postgres:github_ci_only_password@127.0.0.1:5432/brewlite_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:github_ci_only_password@127.0.0.1:5432/brewlite_test?schema=public
      JWT_SECRET: github_ci_test_jwt_secret_never_use_in_production
      ENABLE_DEMO_PAYMENTS: 'true'
      ZALOPAY_AUTO_RECONCILE: 'false'
      FRONTEND_URL: http://localhost:3000
      PORT: '4000'
      API_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Initialize isolated PostgreSQL database
        shell: bash
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d brewlite_test < prisma/dbBrewLite.sql
      - name: Enable mocked wallet ONLY in isolated test database
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d brewlite_test -c "UPDATE public.payment_methods SET is_active = true WHERE code = 'WALLET';"
      - name: Build NestJS
        run: npm run build
      - name: Start test API
        shell: bash
        run: |
          nohup node dist/main.js > /tmp/brewlite-api-e2e.log 2>&1 &
          echo $! > /tmp/brewlite-api-e2e.pid
      - name: Wait for API health
        shell: bash
        run: |
          for i in {1..40}; do
            if curl -fsS --max-time 3 http://127.0.0.1:4000/health > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          cat /tmp/brewlite-api-e2e.log
          exit 1
      - name: End-to-end test (HTTP, localhost only)
        run: npm run test:e2e
      - name: Print API log on failure
        if: failure()
        run: cat /tmp/brewlite-api-e2e.log || true
